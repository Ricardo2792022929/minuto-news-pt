# Temporário: junta fotos livres de direitos e notícias reais do feed para as imagens da Play Store. Apagar depois.
name: tmp material loja
on:
  push:
    branches: [tmp-material-loja]
jobs:
  juntar:
    runs-on: ubuntu-latest
    steps:
      - name: Notícias do feed
        run: |
          mkdir -p out/fotos
          URL="https://yrbpprnbtugzhrbzhxgu.supabase.co"
          KEY="sb_publishable_Q240clLEpscXn_rKI9vNhw_2b0cRfQZ"
          curl -fsS "$URL/rest/v1/articles?select=id,source,category,titulo_inedito,resumo,original_title,published_at,url,image_status&order=published_at.desc&limit=500" \
            -H "apikey: $KEY" -o out/articles.json
          python3 -c "import json;print(len(json.load(open('out/articles.json'))),'notícias')"
      - name: Fotos da app (Unsplash, já usadas como imagens de categoria)
        run: |
          for id in 1453873531674-2151bcd01707 1529107386315-e1a2ed48a620 1518186285589-2f7649de83e0 1522778119026-d647f0596c20 1449824913935-59a10b8d2000 1459749411175-04bf5292ceea 1518770660439-4636190af475; do
            curl -fsSL "https://images.unsplash.com/photo-$id?w=1600&q=85&fm=jpg" -o "out/fotos/app-$id.jpg" || echo "falhou $id"
          done
      - name: Fotos livres por tema (Openverse, só CC0 e domínio público)
        run: |
          python3 - <<'PY2'
          import json, urllib.request, urllib.parse, os, time
          queries = {
            "estadio": "football stadium", "futebol": "soccer ball", "lisboa": "lisbon",
            "eletrico": "lisbon tram", "porto": "porto ribeira", "economia": "stock market",
            "euro": "euro coins", "parlamento": "parliament", "concerto": "concert crowd",
            "cinema": "cinema", "tech": "smartphone", "chip": "circuit board",
            "chuva": "rain umbrella", "mundo": "earth from space", "aviao": "airplane",
            "comboio": "train station", "mar": "ocean waves", "noticias": "newspaper",
            "cidade": "city night", "praia": "beach portugal",
          }
          meta = []
          hdr = {"User-Agent": "flash-noticias-store-assets/1.0"}
          for name, q in queries.items():
            url = "https://api.openverse.org/v1/images/?page_size=12&license=cc0,pdm&size=large&q=" + urllib.parse.quote(q)
            try:
              data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=40))
            except Exception as e:
              print("pesquisa falhou", name, e); time.sleep(2); continue
            n = 0
            for r in data.get("results", []):
              src = r.get("url") or ""
              if not src.lower().split("?")[0].endswith((".jpg", ".jpeg", ".png")): continue
              fn = f"out/fotos/{name}-{n+1}.jpg"
              try:
                req = urllib.request.Request(src, headers={"User-Agent": "Mozilla/5.0 flash-noticias-store-assets"})
                blob = urllib.request.urlopen(req, timeout=40).read()
                if len(blob) < 60000: continue
                open(fn, "wb").write(blob)
              except Exception as e:
                print("download falhou", src, e); continue
              n += 1
              meta.append({"file": os.path.basename(fn), "titulo": r.get("title"), "autor": r.get("creator"), "licenca": r.get("license"), "fonte": r.get("foreign_landing_url"), "w": r.get("width"), "h": r.get("height")})
              if n >= 5: break
            print(name, n)
            time.sleep(1.5)
          json.dump(meta, open("out/fotos/creditos.json", "w"), ensure_ascii=False, indent=1)
          PY2
          ls out/fotos | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: material
          path: out
          retention-days: 2
