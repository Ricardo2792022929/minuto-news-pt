name: atualizar noticias

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Puxar noticias novas
        run: curl -fsS --retry 2 --max-time 90 "https://minuto-news-pt.lovable.app/api/public/hooks/refresh"
