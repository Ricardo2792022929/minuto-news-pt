name: ver feed

# Só leitura: mostra a idade da notícia mais recente. Lançar à mão.
on:
  workflow_dispatch:

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Últimas notícias
        run: |
          # Base real da app. A chave publishable é pública por desenho (vai dentro da app).
          URL="https://yrbpprnbtugzhrbzhxgu.supabase.co"
          KEY="sb_publishable_Q240clLEpscXn_rKI9vNhw_2b0cRfQZ"
          curl -fsS "$URL/rest/v1/articles?select=source,published_at,created_at,titulo_inedito&order=published_at.desc&limit=8" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o feed.json
          echo "agora: $(date -u +%FT%TZ)"
          python3 - <<'PY'
          import json, datetime as d
          now = d.datetime.now(d.timezone.utc)
          for r in json.load(open("feed.json")):
              t = d.datetime.fromisoformat(r["published_at"].replace("Z", "+00:00"))
              c = d.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) if r.get("created_at") else None
              guardada = f"guardada há {int((now-c).total_seconds()//60)} min" if c else ""
              print(f'publicada há {int((now-t).total_seconds()//60):>4} min | {guardada} | {r["source"]}')
          PY
      - name: Sonda das IAs de título
        run: |
          curl -sS --max-time 90 "https://minuto-news-pt.lovable.app/api/public/hooks/refresh?probe=1" | python3 -m json.tool || true
