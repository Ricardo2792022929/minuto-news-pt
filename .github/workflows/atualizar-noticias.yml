name: atualizar noticias

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Puxar noticias novas
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: curl -fsS --retry 2 --max-time 90 -H "Authorization: Bearer $REFRESH_TOKEN" "https://minuto-news-pt.lovable.app/api/public/hooks/refresh?budget=70"
