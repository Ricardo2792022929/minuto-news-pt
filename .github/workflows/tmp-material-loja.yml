# Temporário: junta fotos livres (CC0 / domínio público), notícias reais do feed e os tipos de letra
# para as imagens da Play Store. O resultado vai para o ramo tmp-loja-out. Apagar depois.
name: tmp material loja
on:
  push:
    branches: [tmp-material-loja]
permissions:
  contents: write
jobs:
  juntar:
    runs-on: ubuntu-latest
    steps:
      - name: Notícias do feed
        run: |
          mkdir -p out/fotos out/fonts
          URL="https://yrbpprnbtugzhrbzhxgu.supabase.co"
          KEY="sb_publishable_Q240clLEpscXn_rKI9vNhw_2b0cRfQZ"
          curl -fsS "$URL/rest/v1/articles?select=id,source,category,titulo_inedito,resumo,original_title,published_at,url,image_status&order=published_at.desc&limit=500" \
            -H "apikey: $KEY" -o out/articles.json
      - name: Fotos da app (imagens de categoria, Unsplash)
        run: |
          for id in 1453873531674-2151bcd01707 1529107386315-e1a2ed48a620 1518186285589-2f7649de83e0 1522778119026-d647f0596c20 1449824913935-59a10b8d2000 1459749411175-04bf5292ceea 1518770660439-4636190af475; do
            curl -fsSL "https://images.unsplash.com/photo-$id?w=1600&q=85&fm=jpg" -o "out/fotos/app-$id.jpg" || echo "falhou $id"
          done
      - name: Fotos livres por tema (Openverse, só CC0 e domínio público, miniaturas de 1280 px)
        run: |
          python3 - <<'PY2'
          import json, urllib.request, urllib.parse, os, time, re
          UA = "FlashNoticiasStoreAssets/1.0 (https://github.com/Ricardo2792022929/minuto-news-pt)"
          queries = {
            "estadio": "football stadium crowd", "relvado": "soccer field", "bola": "soccer ball",
            "lisboa": "lisbon city", "eletrico": "lisbon tram", "porto": "porto douro",
            "bolsa": "stock exchange", "euro": "euro banknotes", "parlamento": "parliament hemicycle",
            "concerto": "concert stage lights", "cinema": "movie theater", "smartphone": "smartphone",
            "chip": "microchip", "chuva": "rain city street", "terra": "earth from space nasa",
            "aviao": "airplane", "comboio": "train", "ondas": "big wave surf", "jornal": "newspapers",
            "cidade": "city skyline night", "praia": "algarve beach", "energia": "wind turbines",
            "foguetao": "rocket launch", "museu": "museum", "festival": "music festival",
          }
          def thumb(u):
            m = re.match(r"https://upload\.wikimedia\.org/wikipedia/commons/([0-9a-f])/([0-9a-f]{2})/([^/?]+)$", u)
            if not m: return u
            name = m.group(3)
            return f"https://upload.wikimedia.org/wikipedia/commons/thumb/{m.group(1)}/{m.group(2)}/{name}/1280px-{name}" + (".jpg" if name.lower().endswith((".png", ".tif", ".tiff")) else "")
          meta = []
          for key, q in queries.items():
            url = "https://api.openverse.org/v1/images/?page_size=20&license=cc0,pdm&size=large&q=" + urllib.parse.quote(q)
            data = None
            for attempt in range(3):
              try:
                data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=60)); break
              except Exception as e:
                print("pesquisa falhou", key, e); time.sleep(5)
            if not data: continue
            n = 0
            for r in data.get("results", []):
              src = r.get("url") or ""
              if not re.search(r"\.(jpe?g|png)$", src.split("?")[0], re.I): continue
              w, h = r.get("width") or 0, r.get("height") or 0
              if w and h and max(w, h) < 1000: continue
              dl = thumb(src)
              try:
                blob = urllib.request.urlopen(urllib.request.Request(dl, headers={"User-Agent": UA}), timeout=60).read()
              except Exception as e:
                print("download falhou", dl[:120], e); time.sleep(2); continue
              if len(blob) < 50000: continue
              n += 1
              fn = f"{key}-{n}.jpg"
              open("out/fotos/" + fn, "wb").write(blob)
              meta.append({"file": fn, "titulo": r.get("title"), "autor": r.get("creator"), "licenca": r.get("license"), "fonte": r.get("foreign_landing_url")})
              time.sleep(1.2)
              if n >= 6: break
            print(key, n)
          json.dump(meta, open("out/fotos/creditos.json", "w"), ensure_ascii=False, indent=1)
          PY2
      - name: Tipos de letra
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          curl -fsSL -A "$UA" "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Schibsted+Grotesk:wght@500;600;700;800;900&display=swap" -o out/fonts/fonts.css
          i=0
          for u in $(grep -o 'https://fonts.gstatic.com[^)]*' out/fonts/fonts.css | sort -u); do
            i=$((i+1)); curl -fsSL "$u" -o "out/fonts/f$i.woff2"; python3 -c "import sys;p='out/fonts/fonts.css';s=open(p).read().replace(sys.argv[1],sys.argv[2]);open(p,'w').write(s)" "$u" "f$i.woff2"
          done
          ls out/fonts | wc -l
      - name: Publicar no ramo tmp-loja-out
        run: |
          cd out
          git init -q -b tmp-loja-out
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "material"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-loja-out:tmp-loja-out
